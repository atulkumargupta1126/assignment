
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Website</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    font-size: 1rem;
    background: #f4f4f4;
}

/* Navbar using Flexbox */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: #222;
    color: white;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 1rem;
}

/* Mobile-first Grid layout */
.container {
    display: grid;
    grid-template-areas:
        "head"
        "side"
        "main"
        "foot";
    gap: 1rem;
    padding: 1rem;
}

header { grid-area: head; }
aside  { grid-area: side; }
main   { grid-area: main; }
footer { grid-area: foot; }

header, aside, main, footer {
    background: white;
    padding: 1.5rem;
    border-radius: 0.5rem;
}

img {
    max-width: 100%;
    height: auto;
}

/* Tablet: 768px */
@media (min-width: 768px) {
    .container {
        grid-template-columns: 1fr 2fr;
        grid-template-areas:
            "head head"
            "side main"
            "foot foot";
    }
}

/* Desktop: 1024px */
@media (min-width: 1024px) {
    .container {
        max-width: 1200px;
        margin: auto;
        grid-template-columns: 1fr 3fr;
    }

    body {
        font-size: 1.125rem;
    }
}
</style>
</head>

<body>

<nav>
    <h2>My Website</h2>
    <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</nav>

<div class="container">

    <header>
        <h1>Welcome</h1>
        <p>Responsive website using CSS Grid.</p>
    </header>

    <aside>
        <h2>Sidebar</h2>
        <p>Additional information.</p>
    </aside>

    <main>
        <h2>Main Content</h2>
        <p>Website content goes here.</p>
        <img src="https://via.placeholder.com/600x250"
             alt="Sample image">
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</div>

</body>
</html>

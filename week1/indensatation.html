
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the website responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>My Resume</title>

    <!-- CSS styling starts here -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        /* Main resume container */
        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        /* Main heading style */
        h1 {
            color: navy;
            text-align: center;
        }

        /* Section heading style */
        h2 {
            color: darkblue;
        }

        /* Common style for section boxes */
        .box {
            border: 1px solid gray;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }

        /* Skills section background */
        #skills {
            background-color: #e8f5e9;
        }

        /* Education section background */
        #education {
            background-color: #e3f2fd;
        }
    </style>
</head>

<body>

    <!-- Main resume content -->
    <div class="container">

        <h1>My Resume</h1>

        <!-- About Me section -->
        <h2>About Me</h2>
        <p>
            Hello! I am a B.Tech student learning web development.
        </p>

        <!-- Skills section with ID and class -->
        <div id="skills" class="box">
            <h2>Skills</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Java</li>
            </ul>
        </div>

        <!-- Education section with ID and class -->
        <div id="education" class="box">
            <h2>Education</h2>

            <ul>
                <li>B.Tech - Your University</li>
                <li>12th - Your School</li>
                <li>10th - Your School</li>
            </ul>
        </div>

        <!-- Contact information -->
        <h2>Contact</h2>
        <p>Email: yourname@example.com</p>

    </div>

</body>

</html>
